[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foilpolars"
version = "0.1.0"
description = "Multifidelity aerodynamic polar data for NACA hydrofoil profiles"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Rimple Sandhu", email = "sandhu.rimple87@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "neuralfoil>=0.3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "aerosandbox>=4.2.4",
    "g2aero",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[project.urls]
Repository = "https://github.com/rimplesandhu/foilpolars"

[project.scripts]
foilpolars = "foilpolars.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["foilpolars"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
g2aero = { git = "https://github.com/NatLabRockies/G2Aero.git" }
