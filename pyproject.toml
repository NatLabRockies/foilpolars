[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foilpolars"
version = "0.1.0"
description = "Grassmannian foil shape sweeps for polar generation"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Rimple Sandhu", email = "rimple.sandhu@nlr.gov" },
    { name = "Andrew Glaws" },
    { name = "Malik Hassanaly" },
    { name = "Bumseok Lee" },
    { name = "Ryan King" },
]
requires-python = ">=3.13"
dependencies = [
    "neuralfoil>=0.3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "aerosandbox>=4.2.4",
    "g2aero",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[project.urls]
Repository = "https://github.com/NatLabRockies/foilpolars"

[project.scripts]
foilpolars = "foilpolars.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["foilpolars"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
g2aero = { git = "https://github.com/NatLabRockies/G2Aero.git" }
