baseline:
  - "sg6043"      # low Re performance: Re 1e5-1e6, best cavitation margin
  - "naca642415"  # full-scale tidal: Re 5e5-6e6, passive-pitch reference
  - "naca4415"    # robust deployment: Re 3e5-2e6, DOE RM1 reference
  - "naca633218"  # high Cl/Cd: Re 5e5-3e6, highest Cl/Cd
  - "naca16018"   # low cavitation inception: Re 5e5-5e6, marine/propeller

grassmann:
  n_repanel_points_per_side: 100
  n_perturb: 20         # number of perturbed shapes to sample
  seed: 0               # rng seed for reproducible sampling

solvers:
  neuralfoil:
    enabled: true
    model_size: "xxxlarge"
  xfoil:
    enabled: true
    max_iter: 300

sweep:
  alpha:
    start: -10
    stop: 20
    step: 5
  reynolds: [1e+6, 5e+6]
  n_crit: [3, 9]               # shared by NeuralFoil and XFoil
  forced_transition:  # eN can't represent Tu above ~3%, so pin xtr instead
    - tu: 5.0        # %, e.g. high-ambient-turbulence / wake inflow
      xtr_top: 0.05  # x/c trip location, both surfaces near the LE
      xtr_bot: 0.05

cavitation:
  chord: 0.5        # m — mid-span chord, full-scale tidal
  depth: 30.0        # m
  temperature: 10.0  # degC

postprocess:
  n_worst_foils_for_plot: 5    # foils shown in the per-foil comparison plots
  min_xfoil_conv: 0.75         # XFoil converged-fraction threshold line
  min_neuralfoil_confidence: 0.75  # NeuralFoil confidence threshold line
  min_te_thickness: 1.0e-4     # trailing-edge thickness threshold line
  min_thickness: 0.05          # max-thickness (t/c) threshold line
